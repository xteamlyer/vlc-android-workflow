name: VLC Android Nightly Release Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      vlc_android_ref:
        description: 'vlc-android branch/tag/commit to build'
        required: false
        default: 'master'

env:
  BUILD_DIR: vlc-android

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm, arm64, x86, x86_64]
        vlc_major: [3, 4]

    steps:
      - name: Checkout vlc-android
        uses: actions/checkout@v7
        with:
          repository: videolan/vlc-android
          ref: ${{ github.event.inputs.vlc_android_ref || 'master' }}
          path: ${{ env.BUILD_DIR }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set Android SDK environment
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install NDK (VLC3)
        if: matrix.vlc_major == 3
        run: |
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Install NDK (VLC4)
        if: matrix.vlc_major == 4
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake ant autopoint cmake build-essential libtool-bin \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            flex python3 wget

      - name: Compute short revision
        id: rev
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Cache libvlcjni and VLC build outputs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_DIR }}/libvlcjni
            ${{ env.BUILD_DIR }}/.dbg
          key: vlc-contrib-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${{ steps.rev.outputs.short_sha }}
          restore-keys: |
            vlc-contrib-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-

      # The current upstream medialibrary script still uses the removed
      # AGP libraryVariants API and configures Maven publication although
      # this workflow only assembles the application. Keep the build green
      # with AGP 9.1.1 by removing those CI-irrelevant legacy hooks.
      - name: Patch medialibrary for AGP 9
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          sed -i -E '/com\.vanniktech\.maven\.publish/d' medialibrary/build.gradle
          sed -i -E '/apply[[:space:]]+from:.*publish\.gradle/d' medialibrary/build.gradle
          sed -i '/^    \/\/ Make per-variant version code$/,/^    }$/d' medialibrary/build.gradle
          ! grep -nE 'libraryVariants|vanniktech.maven.publish|publish.gradle' medialibrary/build.gradle
          # AGP 9 removed the legacy applicationVariants API. APK naming and
          # ABI split selection are not needed by this artifact collection.
          sed -i '/^    \/\/ make per-variant version code$/,/^    }$/d' application/app/build.gradle
          # Remove the same obsolete variant/publication hooks from every
          # library module, including remote-access-client.
          find application -name build.gradle -type f -print0 \
            | xargs -0 sed -i -E \
              -e '/com\.vanniktech\.maven\.publish/d' \
              -e '/apply[[:space:]]+from:.*publish\.gradle/d' \
              -e '/^    \/\/ Make per-variant version code$/,/^    }$/d'
          # AGP 9 provides Kotlin itself. External Kotlin Android/KAPT
          # plugins try to register the same `kotlin` extension and fail.
          find application -name build.gradle -type f -print0 \
            | xargs -0 sed -i -E \
              "/(kotlin-android|org\.jetbrains\.kotlin\.android|kotlin-kapt)/d"
          if ! grep -q 'android.builtInKotlin=true' buildsystem/compile.sh; then
            sed -i '/android.useAndroidX=true/ a echo android.builtInKotlin=true >> gradle.properties' buildsystem/compile.sh
          fi
          if ! grep -q 'android.disallowKotlinSourceSets=false' buildsystem/compile.sh; then
            sed -i '/android.builtInKotlin=true/ a echo android.disallowKotlinSourceSets=false >> gradle.properties' buildsystem/compile.sh
          fi
          # compile.sh clones libvlcjni during the build step. Run this
          # standalone cleanup immediately before compile.sh invokes Gradle.
          cat > ci-patch-libvlcjni.sh <<'PATCH_LIBVLCJNI'
          #!/usr/bin/env bash
          set -euo pipefail
          find libvlcjni -name build.gradle -type f -print0 \
            | xargs -0 sed -i -E \
              -e '/com\.vanniktech\.maven\.publish/d' \
              -e '/apply[[:space:]]+from:.*publish\.gradle/d' \
              -e '/^    \/\/ Make per-variant version code$/,/^    }$/d' \
              -e '/(kotlin-android|org\.jetbrains\.kotlin\.android|kotlin-kapt)/d'
          PATCH_LIBVLCJNI
          chmod +x ci-patch-libvlcjni.sh
          sed -i '/^# GRADLE #$/i ./ci-patch-libvlcjni.sh' buildsystem/compile.sh

      # The current VLC Android repository has no checked-in Gradle wrapper.
      # buildsystem/compile.sh is the source of truth: it downloads Gradle
      # 9.3.1, verifies its SHA-256, creates gradlew and initializes
      # local.properties before evaluating build.gradle.
      - name: Decode signing keystore
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release for ${{ matrix.abi }} (VLC${{ matrix.vlc_major }})
        working-directory: ${{ env.BUILD_DIR }}
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x buildsystem/compile.sh
          EXTRA_ARGS=""
          if [ "${{ matrix.vlc_major }}" = "4" ]; then
            EXTRA_ARGS="-vlc4"
          fi
          ./buildsystem/compile.sh \
            -a "${{ matrix.abi }}" \
            --signrelease \
            -s "$(pwd)/release.keystore" \
            -p "$PASSWORD_KEYSTORE" \
            $EXTRA_ARGS

      - name: Collect artifacts
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ../out
          find application -path '*/build/outputs/apk/*ignedRelease*/*.apk' -exec cp {} ../out/ \;
          cd ../out
          found=0
          for f in *.apk; do
            [ -f "$f" ] || continue
            found=1
            mv "$f" "vlc-android-nightly-${{ steps.rev.outputs.date }}-${{ steps.rev.outputs.short_sha }}-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${f}"
          done
          test "$found" -eq 1
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlc-android-nightly-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${{ github.run_id }}
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: vlc-android-nightly-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.tag.outputs.date }}-${{ github.run_number }}
          name: VLC Android Nightly ${{ steps.tag.outputs.date }} (run ${{ github.run_number }})
          prerelease: true
          files: artifacts/*.apk
