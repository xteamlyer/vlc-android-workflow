name: VLC Android Nightly Release Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      vlc_android_ref:
        description: 'vlc-android branch/tag/commit to build'
        required: false
        default: 'master'

env:
  BUILD_DIR: vlc-android
  GRADLE_PIN_VERSION: 8.11.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm, arm64, x86, x86_64]
        vlc_major: [3, 4]

    steps:
      - name: Checkout vlc-android
        uses: actions/checkout@v7
        with:
          repository: videolan/vlc-android
          ref: ${{ github.event.inputs.vlc_android_ref || 'master' }}
          path: ${{ env.BUILD_DIR }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK (VLC3)
        if: matrix.vlc_major == 3
        run: |
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_VERSION=21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Install NDK (VLC4)
        if: matrix.vlc_major == 4
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # build.gradle reads this file while evaluating the root project. It must
      # exist before any Gradle command, including `gradle wrapper`.
      - name: Create Android local.properties
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          android.ndkFullVersion=${ANDROID_NDK_VERSION}
          android.ndkPath=${ANDROID_NDK}
          EOF

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake ant autopoint cmake build-essential libtool-bin \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            flex python3 wget

      - name: Compute short revision
        id: rev
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Cache libvlcjni (contains vlc/ sources + contribs)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_DIR }}/libvlcjni
            ${{ env.BUILD_DIR }}/.dbg
          key: vlc-contrib-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${{ steps.rev.outputs.short_sha }}
          restore-keys: |
            vlc-contrib-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-

      # Do not run `gradle wrapper`: that command evaluates build.gradle and
      # fails if local.properties is absent. Updating the distribution URL is
      # sufficient and keeps the checked-in wrapper jar untouched.
      - name: Pin Gradle wrapper to a known-working version
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          test -f gradle/wrapper/gradle-wrapper.properties
          sed -i -E \
            "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${GRADLE_PIN_VERSION}-bin.zip#" \
            gradle/wrapper/gradle-wrapper.properties
          chmod a+x gradlew
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      - name: Decode signing keystore
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          {
            echo "keyStoreFile=$(pwd)/release.keystore"
            echo "storealias=vlc"
            echo "android.enableJetifier=true"
            echo "android.useAndroidX=true"
          } > gradle.properties

      - name: Build signed release for ${{ matrix.abi }} (VLC${{ matrix.vlc_major }})
        working-directory: ${{ env.BUILD_DIR }}
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x buildsystem/compile.sh
          EXTRA_ARGS=""
          if [ "${{ matrix.vlc_major }}" = "4" ]; then
            EXTRA_ARGS="-vlc4"
          fi
          ./buildsystem/compile.sh -a ${{ matrix.abi }} --signrelease $EXTRA_ARGS

      - name: Collect artifacts
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ../out
          find application -path '*/build/outputs/apk/*ignedRelease*/*.apk' -exec cp {} ../out/ \
            \;
          cd ../out
          for f in *.apk; do
            [ -f "$f" ] || continue
            mv "$f" "vlc-android-nightly-${{ steps.rev.outputs.date }}-${{ steps.rev.outputs.short_sha }}-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${f}"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vlc-android-nightly-vlc${{ matrix.vlc_major }}-${{ matrix.abi }}-${{ github.run_id }}
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: vlc-android-nightly-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ steps.tag.outputs.date }}-${{ github.run_number }}
          name: VLC Android Nightly ${{ steps.tag.outputs.date }} (run ${{ github.run_number }})
          prerelease: true
          files: artifacts/*.apk
