name: VLC Android Nightly Release Build

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      vlc_android_ref:
        description: 'vlc-android branch/tag/commit to build'
        required: false
        default: 'master'

env:
  BUILD_DIR: vlc-android

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm, arm64, x86, x86_64]

    steps:
      - name: Checkout vlc-android
        uses: actions/checkout@v5
        with:
          repository: videolan/vlc-android
          ref: ${{ github.event.inputs.vlc_android_ref || 'master' }}
          path: ${{ env.BUILD_DIR }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake ant autopoint cmake build-essential libtool-bin \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            flex python3 wget

      - name: Compute short revision
        id: rev
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Cache libvlcjni (contains vlc/ sources + contribs)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/libvlcjni
            ${{ env.BUILD_DIR }}/.dbg
          key: vlc-contrib-${{ matrix.abi }}-${{ steps.rev.outputs.short_sha }}-ndk28.0.13004108
          restore-keys: |
            vlc-contrib-${{ matrix.abi }}-

      - name: Decode signing keystore
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "keyStoreFile=$(pwd)/release.keystore" > gradle.properties
          echo "storealias=vlc" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build signed release for ${{ matrix.abi }}
        working-directory: ${{ env.BUILD_DIR }}
        env:
          PASSWORD_KEYSTORE: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x buildsystem/compile.sh
          ./buildsystem/compile.sh -a ${{ matrix.abi }} --signrelease

      - name: Collect artifacts
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p ../out
          find application -path '*/build/outputs/apk/*ignedRelease*/*.apk' -exec cp {} ../out/ \;
          cd ../out
          for f in *.apk; do
            [ -f "$f" ] || continue
            mv "$f" "vlc-android-nightly-${{ steps.rev.outputs.date }}-${{ steps.rev.outputs.short_sha }}-${{ matrix.abi }}-${f}"
          done
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-android-nightly-${{ matrix.abi }}-${{ github.run_id }}
          path: out/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vlc-android-nightly-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.tag.outputs.date }}-${{ github.run_number }}
          name: VLC Android Nightly ${{ steps.tag.outputs.date }} (run ${{ github.run_number }})
          prerelease: true
          files: artifacts/*.apk
